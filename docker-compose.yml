version: '3.8'

services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    depends_on:
      - rabbitmq
    restart: unless-stopped

  celery_worker:
    build: ./Backend
    env_file:
      - ./Backend/.env
    depends_on:
      - rabbitmq
    command: celery -A celery_worker.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
    restart: unless-stopped

  frontend:
    build: ./Frontend/smart-audit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    driver: bridge
